name: Repackage Mi Calculator 17.4.1 as com.mathengine

on:
  push:
    branches:
      - "repackage/mi-calculator-17.4.1-com-mathengine"

permissions:
  contents: read

jobs:
  repackage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout package patcher
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: "true"
          packages: "build-tools;35.0.0"

      - name: Install ZIP alignment utility
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign

      - name: Retrieve original APK from verified source artifact
        uses: actions/download-artifact@v4
        with:
          name: Mi-Calculator-17.4.1-Reference-APK
          path: source-artifact
          run-id: 45952046119
          github-token: ${{ github.token }}

      - name: Verify original Xiaomi APK
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s source-artifact/Mi-Calculator-17.4.1.apk
          test "$(stat -c '%s' source-artifact/Mi-Calculator-17.4.1.apk)" = "10041008"
          echo "ec0929d2ff510bde653293e1bd8fd668077a27dce26dd5832da31d6718af8108  source-artifact/Mi-Calculator-17.4.1.apk" | sha256sum --check -

      - name: Patch Android binary manifest and DEX provider authority
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 build-input/repackage-mi-calculator.py \
            source-artifact/Mi-Calculator-17.4.1.apk \
            Mi-Calculator-17.4.1-com.mathengine-unsigned.apk
          test -s Mi-Calculator-17.4.1-com.mathengine-unsigned.apk

      - name: Align, sign and verify package and version
        shell: bash
        run: |
          set -Eeuo pipefail
          BT="$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$BT/zipalign" -p -f 4 Mi-Calculator-17.4.1-com.mathengine-unsigned.apk aligned.apk
          keytool -genkeypair -v -keystore temporary-signing.jks -storepass android \
            -keypass android -alias repackage -keyalg RSA -keysize 2048 -validity 3650 \
            -dname "CN=Mi Calculator Repackage, OU=Local Test, O=Independent, C=BD"
          "$BT/apksigner" sign --min-sdk-version 29 \
            --ks temporary-signing.jks --ks-pass pass:android --key-pass pass:android \
            --out Mi-Calculator-17.4.1-com.mathengine.apk aligned.apk
          "$BT/apksigner" verify --verbose Mi-Calculator-17.4.1-com.mathengine.apk
          "$BT/aapt" dump badging Mi-Calculator-17.4.1-com.mathengine.apk > badging.txt
          grep -F "package: name='com.mathengine' versionCode='317000041' versionName='17.4.1'" badging.txt
          "$BT/aapt" dump xmltree Mi-Calculator-17.4.1-com.mathengine.apk AndroidManifest.xml > manifest-tree.txt
          grep -F 'com.mathengine.fileprovider' manifest-tree.txt
          grep -F 'com.mathengine.widget.provider' manifest-tree.txt
          grep -F 'com.mathengine.androidx-startup' manifest-tree.txt
          unzip -t Mi-Calculator-17.4.1-com.mathengine.apk >/dev/null
          mkdir -p artifacts
          cp Mi-Calculator-17.4.1-com.mathengine.apk artifacts/
          sha256sum artifacts/Mi-Calculator-17.4.1-com.mathengine.apk > artifacts/Mi-Calculator-17.4.1-com.mathengine.apk.sha256
          CERT_SHA="$("$BT/apksigner" verify --print-certs Mi-Calculator-17.4.1-com.mathengine.apk | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print $2}')"
          {
            echo "Source: Xiaomi Mi Calculator 17.4.1"
            echo "Original package: com.miui.calculator"
            echo "Repackaged package: com.mathengine"
            echo "Version: 17.4.1 (317000041)"
            echo "Architecture: arm64-v8a"
            echo "Minimum Android: 10 (API 29)"
            echo "Original APK SHA-256: ec0929d2ff510bde653293e1bd8fd668077a27dce26dd5832da31d6718af8108"
            echo "New signing certificate SHA-256: $CERT_SHA"
            echo "Signature: VALID"
            echo "Archive integrity: PASS"
            echo "Package and version verification: PASS"
            echo "Note: Modified independently re-signed APK; not Xiaomi-signed."
          } > artifacts/REPACKAGE-REPORT.txt
          stat -c 'REPACKAGED_APK_SIZE_BYTES=%s' artifacts/Mi-Calculator-17.4.1-com.mathengine.apk
          cat artifacts/Mi-Calculator-17.4.1-com.mathengine.apk.sha256
          cat artifacts/REPACKAGE-REPORT.txt

      - name: Upload repackaged APK
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Calculator-17.4.1-com.mathengine
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
