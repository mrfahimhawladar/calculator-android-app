name: Android Native Build Environment

on:
  push:
    branches:
      - mi-calculator-native-port-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare-android-environment:
    name: Install and verify Android toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify installed build tools
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          sdkmanager --list_installed
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/35.0.0/d8"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/platform-tools/adb"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" version
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" version
          echo "ANDROID_NATIVE_TOOLCHAIN_READY=true"

      - name: Save toolchain inventory
        if: always()
        run: |
          mkdir -p build-environment
          {
            java -version 2>&1
            gradle --version
            sdkmanager --list_installed
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "BUILD_TOOLS=35.0.0"
            echo "COMPILE_SDK=35"
            echo "MIN_JDK=17"
          } > build-environment/toolchain.txt

      - name: Upload toolchain inventory
        uses: actions/upload-artifact@v4
        with:
          name: android-build-environment-inventory
          path: build-environment/toolchain.txt
          if-no-files-found: warn
