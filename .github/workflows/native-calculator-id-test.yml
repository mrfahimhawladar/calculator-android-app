name: Native Calculator ID build test

on:
  push:
    branches:
      - native-calculator-id-test
    paths:
      - 'native-calculator/**'
      - '.github/workflows/native-calculator-id-test.yml'

permissions:
  contents: read

concurrency:
  group: native-calculator-id-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'

      - name: Set up Android SDK (accept license terms)
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Install Android API 36 and Build Tools 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Run native unit tests and attempt debug APK build
        working-directory: native-calculator
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug --stacktrace

      - name: Verify APK package identity and signature
        working-directory: native-calculator
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "package: name='Calculator'"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$APK"
          sha256sum "$APK"

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-native-debug-APK
          path: native-calculator/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
