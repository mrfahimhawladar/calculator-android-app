name: Build Android Debug APK

on:
  # One-time build start: triggered only when the explicit approval marker is committed.
  push:
    branches: [main]
    paths:
      - '.github/run-android-apk-build.once'
  workflow_dispatch:
    inputs:
      accept_android_sdk_licenses:
        description: 'I reviewed and agree to the Android SDK license terms required by this build.'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: calculator-android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Test, build, and verify installable debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verify one-time SDK license acknowledgement record
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s .github/run-android-apk-build.once
          if ! grep -Fx 'SDK_LICENSES_ACCEPTED_FOR_ONE_BUILD=yes' .github/run-android-apk-build.once \
             && ! grep -Fx '"SDK_LICENSES_ACCEPTED_FOR_ONE_BUILD=yes"' .github/run-android-apk-build.once; then
            echo "::error::One-time SDK license approval marker is missing or malformed." >&2
            exit 1
          fi
          echo 'SDK_LICENSE_ACKNOWLEDGEMENT=RECORDED_FOR_THIS_BUILD'

      - name: Require explicit SDK license acknowledgement
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.accept_android_sdk_licenses != true }}
        shell: bash
        run: |
          echo "::error::Review the Android SDK license terms and re-run with accept_android_sdk_licenses enabled." >&2
          exit 1

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Preflight DNS and HTTPS before tool downloads
        shell: bash
        run: |
          set -Eeuo pipefail
          check_host() {
            local host="$1" attempt delay
            for attempt in 1 2 3 4; do
              if getent ahosts "$host" >/dev/null 2>&1; then
                echo "[DNS OK] $host (attempt $attempt/4)"
                return 0
              fi
              if [[ "$attempt" -lt 4 ]]; then
                delay=$((attempt * 2))
                echo "[DNS RETRY $attempt/3] $host failed; waiting ${delay}s for transient DNS failure." >&2
                sleep "$delay"
              fi
            done
            echo "::error::DNS remained unavailable for $host after 4 tries. No SDK/package setup was started." >&2
            exit 3
          }
          check_url() {
            local url="$1"
            echo "[HTTPS PREFLIGHT] $url"
            if ! curl --fail --silent --show-error --head --location --retry 2 --retry-all-errors --retry-delay 2 --retry-max-time 15 --connect-timeout 5 --max-time 20 "$url" -o /dev/null; then
              echo "::error::HTTPS preflight failed for $url. Review the actual network error." >&2
              exit 3
            fi
            echo "[HTTPS OK] $url"
          }
          for host in registry.npmjs.org dl.google.com services.gradle.org repo.maven.apache.org maven.google.com github.com release-assets.githubusercontent.com objects.githubusercontent.com nodejs.org; do
            check_host "$host"
          done
          for url in https://registry.npmjs.org/ https://dl.google.com/android/repository/repository2-1.xml https://services.gradle.org/ https://repo.maven.apache.org/maven2/ https://maven.google.com/ https://github.com/ https://nodejs.org/dist/index.json; do
            check_url "$url"
          done
          echo "BUILD_NETWORK_PREFLIGHT=PASS"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'true'
          packages: ''

      - name: Install required Android API and build tools
        shell: bash
        run: |
          set -Eeuo pipefail
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          test -s "$SDK_ROOT/platforms/android-35/android.jar"
          test -x "$SDK_ROOT/build-tools/35.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/35.0.0/aapt"
          test -x "$SDK_ROOT/platform-tools/adb"

      - name: Install JavaScript dependencies
        run: npm_config_fetch_retries=2 npm_config_fetch_retry_mintimeout=1000 npm_config_fetch_retry_maxtimeout=8000 npm install --no-audit --no-fund

      - name: Test, build, and verify APK
        env:
          ANDROID_SDK_ACCEPT_LICENSES: 'yes'
          CALCULATOR_AUTO_INSTALL_ANDROID_SDK: '0'
        run: npm run android:build:debug

      - name: Write checksum sidecar
        shell: bash
        run: |
          set -Eeuo pipefail
          APK_DIR="android/app/build/outputs/apk/debug"
          test -s "$APK_DIR/app-debug.apk"
          (cd "$APK_DIR" && sha256sum app-debug.apk > app-debug.apk.sha256)
          cat "$APK_DIR/app-debug.apk.sha256"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-debug-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
