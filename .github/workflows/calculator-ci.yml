name: Calculator CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # 19:00 Bangladesh time (UTC+6) = 13:00 UTC.
    - cron: "0 13 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: calculator-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-web-build:
    name: Regression tests and web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Validate package metadata
        run: node -e "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')); console.log('package.json: valid JSON')"

      - name: Validate shell script syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          for file in scripts/*.sh; do
            test -f "$file" || continue
            bash -n "$file"
            echo "Shell syntax OK: $file"
          done

      - name: Run regression tests
        run: npm test

      - name: Build web application
        run: npm run build

      - name: Verify generated web output
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s www/index.html
          echo "WEB_BUILD_OUTPUT=VERIFIED"
