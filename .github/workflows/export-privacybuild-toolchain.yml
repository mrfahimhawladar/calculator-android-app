name: Temporary PrivacyBuild Toolchain Export

on:
  push:
    branches:
      - tmp/privacybuild-toolchain-export
    paths:
      - '.github/workflows/export-privacybuild-toolchain.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK build tools
        uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;35.0.0'

      - name: Download and verify APKTool distribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pb-toolchain
          curl --fail --location --retry 3 --retry-all-errors \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar \
            -o /tmp/pb-toolchain/apktool_2.10.0.jar
          java -jar /tmp/pb-toolchain/apktool_2.10.0.jar --version
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" version
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -h >/dev/null 2>&1 || true

      - name: Package toolchain
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/pb-toolchain/apktool_2.10.0.jar .
          tar -czf privacybuild-toolchain-linux.tar.gz \
            apktool_2.10.0.jar \
            -C "$ANDROID_HOME/build-tools/35.0.0" .
          sha256sum privacybuild-toolchain-linux.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: privacybuild-toolchain-linux
          path: privacybuild-toolchain-linux.tar.gz
          if-no-files-found: error
          retention-days: 3
