<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d0c">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="A fast, offline-first scientific calculator.">
  <title>Calculator</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="src/calculator-core.js"></script>
  <script defer src="src/app.js"></script>
</head>
<body>
  <main class="app" id="app" tabindex="-1">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
        <div><div class="brand-name">CALCULATOR</div><div class="brand-sub">PRECISION / SIMPLIFIED</div></div>
      </div>
      <div class="top-actions">
        <button class="pill" id="angleMode" type="button" aria-label="Angle mode: degrees. Activate to switch to radians">DEG</button>
        <button class="icon-button" id="historyBtn" type="button" aria-label="Open calculation history" title="History">↺</button>
      </div>
    </header>

    <div class="layout">
      <section class="main-column" aria-label="Calculator">
        <section class="display" aria-live="polite" aria-atomic="true">
          <div class="display-meta"><span id="memoryIndicator" class="memory-indicator" aria-hidden="true">MEM</span><span id="statusLabel">READY WHEN YOU ARE</span></div>
          <div class="expression" id="expression" aria-label="Current expression"></div>
          <div class="result-line"><div class="result" id="result" role="button" tabindex="0" aria-label="Current value. Activate to copy">0</div></div>
          <div class="display-bottom"><span>OFFLINE MODE</span><span id="copyHint">TAP RESULT TO COPY</span></div>
        </section>

        <section class="keys" aria-label="Basic calculator keys">
          <button class="key utility" type="button" data-action="clear" aria-label="All clear">AC</button>
          <button class="key utility" type="button" data-action="sign" aria-label="Toggle sign">+/−</button>
          <button class="key utility" type="button" data-action="percent" aria-label="Percent">%</button>
          <button class="key operator" type="button" data-op="÷" aria-label="Divide">÷</button>
          <button class="key" type="button" data-num="7">7</button><button class="key" type="button" data-num="8">8</button><button class="key" type="button" data-num="9">9</button><button class="key operator" type="button" data-op="×" aria-label="Multiply">×</button>
          <button class="key" type="button" data-num="4">4</button><button class="key" type="button" data-num="5">5</button><button class="key" type="button" data-num="6">6</button><button class="key operator" type="button" data-op="−" aria-label="Subtract">−</button>
          <button class="key" type="button" data-num="1">1</button><button class="key" type="button" data-num="2">2</button><button class="key" type="button" data-num="3">3</button><button class="key operator" type="button" data-op="+" aria-label="Add">+</button>
          <button class="key zero" type="button" data-num="0">0</button><button class="key" type="button" data-action="decimal" aria-label="Decimal point">.</button><button class="key equals" type="button" data-action="equals" aria-label="Calculate">=</button>
        </section>
      </section>

      <section class="science-panel" aria-label="Scientific functions">
        <div class="panel-heading"><span>SCIENTIFIC</span><span class="panel-dot" aria-hidden="true"></span></div>
        <div class="science-grid">
          <button class="key science" type="button" data-action="sin" aria-label="Sine">sin</button><button class="key science" type="button" data-action="cos" aria-label="Cosine">cos</button><button class="key science" type="button" data-action="tan" aria-label="Tangent">tan</button><button class="key science" type="button" data-action="log" aria-label="Logarithm base ten">log</button>
          <button class="key science" type="button" data-action="ln" aria-label="Natural logarithm">ln</button><button class="key science" type="button" data-action="sqrt" aria-label="Square root">√x</button><button class="key science" type="button" data-action="square" aria-label="Square">x²</button><button class="key science" type="button" data-op="^" aria-label="Power">xʸ</button>
          <button class="key science" type="button" data-action="open-paren" aria-label="Open parenthesis">(</button><button class="key science" type="button" data-action="close-paren" aria-label="Close parenthesis">)</button><button class="key science" type="button" data-action="pi" aria-label="Pi constant">π</button><button class="key science" type="button" data-action="euler" aria-label="Euler constant">e</button>
          <button class="key science" type="button" data-action="factorial" aria-label="Factorial">x!</button><button class="key science" type="button" data-action="abs" aria-label="Absolute value">|x|</button><button class="key science" type="button" data-action="reciprocal" aria-label="Reciprocal">1/x</button><button class="key science" type="button" data-action="backspace" aria-label="Backspace">⌫</button><button class="key science" type="button" data-action="memory-add" aria-label="Add to memory">M+</button>
          <button class="key science" type="button" data-action="memory-subtract" aria-label="Subtract from memory">M−</button><button class="key science" type="button" data-action="memory-recall" aria-label="Recall memory">MR</button><button class="key science" type="button" data-action="memory-clear" aria-label="Clear memory">MC</button><button class="key science" type="button" data-action="ans" aria-label="Insert last answer">Ans</button>
        </div>
        <p class="panel-note">Keyboard ready · History saved on this device</p>
      </section>
    </div>

    <footer class="footer"><span>CALCULATOR <b>v0.2.3</b></span><span><i aria-hidden="true"></i> PRIVATE BY DESIGN</span></footer>

    <div class="scrim" id="scrim"></div>
    <aside class="drawer" id="drawer" aria-label="Calculation history" aria-hidden="true" inert>
      <div class="drawer-head"><div><div class="drawer-title">History</div><div class="drawer-caption">Your recent calculations</div></div><button class="icon-button close-button" id="closeHistory" type="button" aria-label="Close history">×</button></div>
      <div class="history-list" id="historyList"></div>
      <div class="drawer-actions"><button class="small-button" id="useLatest" type="button">Use latest</button><button class="small-button danger" id="clearHistory" type="button">Clear history</button></div>
    </aside>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
